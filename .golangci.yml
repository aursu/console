version: "2"
linters:
  default: none
  enable:
    - durationcheck
    - gocritic
    - gomodguard_v2
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    goheader:
      values:
        regexp:
          copyright-holder: Copyright \(c\) (20\d\d\-20\d\d)|2021|({{year}})
      template-path: .license.tmpl
    misspell:
      locale: US
    # v1 enabled staticcheck (SA) and gosimple (S1); v2 merges both into
    # staticcheck and adds stylecheck (ST) and quickfix (QF). Keep the v1 scope.
    staticcheck:
      checks:
        - SA*
        - S1*
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: comment on exported function
      - path: (.+)\.go$
        text: comment on exported type
      - path: (.+)\.go$
        text: should have comment
      - path: (.+)\.go$
        text: use leading k in Go names
      - path: (.+)\.go$
        text: comment on exported const
    paths:
      - api/operations
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - api/operations
      - third_party$
      - builtin$
      - examples$
