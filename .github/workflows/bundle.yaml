name: UI bundle

# The committed web-app/build is what the console binary serves (go:embed).
# This job proves it is built from the committed sources, and shows what
# changed in it in readable form (Job Summary and a PR comment).
on:
  pull_request:
    branches:
      - master
    paths:
      - "web-app/**"
      - ".nvmrc"
      - "fork/bin/bundle_diff.py"
      - "fork/test/test_bundle_diff.py"
      - ".github/workflows/bundle.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Node 25+ no longer ships corepack; every job installs this pinned version
# after setup-node and enables yarn (packageManager in web-app/package.json).
env:
  COREPACK_VERSION: "0.36.0"

jobs:
  bundle:
    name: Bundle matches sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # the readable-diff comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests of the diff tool
        run: python3 -I -m unittest discover -s fork/test -v
      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NVMRC }}
      - name: Enable Corepack
        run: npm install -g "corepack@$COREPACK_VERSION" && corepack enable
      - name: Install modules
        working-directory: ./web-app
        run: yarn install --immutable
      - name: Rebuild the bundle
        working-directory: ./web-app
        run: yarn build
      - name: Committed bundle equals the rebuild
        run: |
          if [ -n "$(git status --porcelain -- web-app/build)" ]; then
            echo "::error::web-app/build does not match a rebuild of the committed sources"
            git status --porcelain -- web-app/build
            exit 1
          fi
      - name: Readable bundle diff
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -I fork/bin/bundle_diff.py --markdown
          --comment "$RUNNER_TEMP/bundle-diff-comment.md" --run-url "$RUN_URL"
          "origin/$BASE_REF" HEAD >> "$GITHUB_STEP_SUMMARY"
      # One comment per PR, found by its hidden marker and updated on every
      # push. Skipped for PRs from forks: their token cannot write.
      - name: Post the readable diff on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/bundle-diff-comment.md"
          if [ ! -s "$body" ]; then
            echo "no comment body (the diff step failed); nothing to post"
            exit 0
          fi
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bundle-diff -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" --silent
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" --silent
          fi
