# @format

name: Vulnerability Check
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read # to fetch code (actions/checkout)

# Node 25+ no longer ships corepack; every job installs this pinned version
# after setup-node and enables yarn (packageManager in web-app/package.json).
env:
  COREPACK_VERSION: "0.36.0"

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # setup-go v5 installs the go.mod "go" line (1.23); the go command then
      # switches to the "toolchain" line (1.27.4) on its own. govulncheck loads
      # packages through the go on PATH, and through the forwarding 1.23 binary
      # it type-checks Go 1.27's standard library at language 1.23 and fails.
      # Put the toolchain's own go first, for both the install and the scan.
      - name: Use go.mod's toolchain
        run: echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash

  react-code-known-vulnerabilities:
    name: "React Code Has No Known Vulnerable Deps"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Read .nvmrc
        id: node_version
        run: echo "$(cat .nvmrc)" && echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NVMRC }}
      - name: Enable Corepack
        run: npm install -g "corepack@$COREPACK_VERSION" && corepack enable
      - name: Checks for known security issues with the installed packages
        working-directory: ./web-app
        continue-on-error: false
        run: |
          yarn npm audit --recursive --environment production --no-deprecations
