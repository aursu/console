# Yarn 4.18 defaults are kept except where this project needs otherwise:
# - git dependencies: only the design system, pinned by tag in package.json;
# - install scripts: off, except packages listed in package.json
#   dependenciesMeta (canvas: its install script fetches the prebuilt N-API
#   binary that Jest's jsdom loads);
# - npmMinimalAgeGate stays at its default (1d).
approvedGitRepositories:
  - "https://github.com/aursu/mds.git"

checksumBehavior: reset

enableScripts: false

nodeLinker: node-modules
